<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number.isFinite(+v)?+v:0,pct=v=>v==null?'—':(100*v).toFixed(1)+'%',fmtDate=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'—',short=s=>String(s||'').slice(0,18),initials=s=>String(s||'DI').split('@')[0].split(/[ ._-]/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('')||'DI';
const state={me:null,datasets:[],archived:[],dataset:null,data:null,page:'overview',rows:[],targets:null,search:'',filters:{status:'all',code:'',city:'',wc:'',overdue:false},pageNum:0,pageSize:20,charts:{},map:null,mapMarkers:[],mapPoints:[],comparison:null,compareAI:'',aiText:'',busy:false};const titles={overview:'Executive overview',notifications:'Notifications explorer',locations:'Locations & GIS',compare:'Period comparison & AI analyst',quality:'Data quality audit',data:'Upload & reports',settings:'Settings'};
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});if(r.status===401){location.href='/login.html';throw new Error('Your session has expired.')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`Request failed (${r.status})`);return j}const post=(body)=>({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4400)}
function setPage(page){state.page=page;$$('#nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=titles[page]||titles.overview;$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'});}finally{location.href='/login.html'}};
$('#datasetSelect').onchange=async e=>{if(!e.target.value)return;await loadDataset(e.target.value)};$('#showArchived').onchange=async()=>{if($('#showArchived').checked){try{state.archived=(await api('/api/datasets?archived=1')).datasets;renderData()}catch(e){toast(e.message,'error')}}else renderData()};
async function bootstrap(){try{state.me=await api('/api/me');$('#userEmail').textContent=state.me.email;$('#userRole').textContent=state.me.role==='admin'?'Administrator':'Standard user';$('#avatar').textContent=initials(state.me.email);$('#roleBadge').textContent=state.me.role;const admin=state.me.role==='admin';$$('[data-admin]').forEach(x=>x.classList.toggle('hidden',!admin));$('#archivedToggleWrap').classList.toggle('hidden',!admin);state.datasets=(await api('/api/datasets')).datasets;fillSelector();if(state.datasets.length)await loadDataset(state.datasets[0].id);else render()}catch(e){if(e.message!=='Your session has expired.')toast(e.message,'error')}}
function fillSelector(){const s=$('#datasetSelect');s.innerHTML=state.datasets.length?state.datasets.map(d=>`<option value="${esc(d.id)}">${esc(d.period)} · v${esc(d.version)} · ${esc(d.name)}</option>`).join(''):'<option value="">No active datasets</option>';if(state.dataset)s.value=String(state.dataset.id)}
async function loadDataset(id){try{const d=await api('/api/datasets/'+encodeURIComponent(id));state.dataset=d;state.data=d.payload;state.rows=d.payload.rows||[];state.targets=d.payload.T||{days:{},assess:.8,wcMax:15,comp:{}};fillSelector();render();if(state.page==='locations')loadMap()}catch(e){toast(e.message,'error')}}
function compute(rows=state.rows,T=state.targets||{}){const n=rows.length,closed=rows.filter(r=>r.closed).length,open=n-closed,days=T.days||{},codesMap={};rows.forEach(r=>{const k=r.code||'(none)',a=codesMap[k]||(codesMap[k]=[]);a.push(r)});const codes=Object.entries(codesMap).map(([code,a])=>{const target=days[code],cl=a.filter(r=>r.closed&&r.wo),ok=target==null?null:cl.filter(r=>num(r.age)<=num(target)).length;return{code,n:a.length,open:a.filter(r=>!r.closed).length,avg:a.reduce((s,r)=>s+num(r.age),0)/(a.length||1),target,late:target==null?0:a.filter(r=>!r.closed&&num(r.age)>num(target)).length,cw:cl.length,ok}}).sort((a,b)=>b.n-a.n);const daysSet=[...new Set(rows.flatMap(r=>[r.dk,r.dd]).filter(Boolean))].sort(),created=daysSet.map(d=>rows.filter(r=>r.dk===d).length),completed=daysSet.map(d=>rows.filter(r=>r.dd===d).length),bucket=[['0–2 days',0,2],['3–4 days',3,4],['5–6 days',5,6],['7+ days',7,Infinity]].map(([label,lo,hi])=>({label,open:rows.filter(r=>!r.closed&&num(r.age)>=lo&&num(r.age)<=hi).length,closed:rows.filter(r=>r.closed&&num(r.age)>=lo&&num(r.age)<=hi).length}));const status={};rows.forEach(r=>{const k=r.base||r.st||'Unknown';status[k]=(status[k]||0)+1});const completeness={wo:rows.filter(r=>r.wo).length/(n||1),wc:rows.filter(r=>r.wcc).length/(n||1),fl:rows.filter(r=>r.floc).length/(n||1),as:rows.filter(r=>r.asm).length/(n||1),fc:rows.filter(r=>r.code&&r.code!=='(none)').length/(n||1)};const assessed=rows.filter(r=>r.asd).length/(n||1),late=codes.reduce((s,c)=>s+c.late,0),avg=n?rows.reduce((s,r)=>s+num(r.age),0)/n:0,emergency=rows.filter(r=>r.emer).length;const locations=(key)=>{const m={};rows.forEach(r=>{const v=String(r[key]||'(unspecified)').trim();m[v]=(m[v]||0)+1});return Object.entries(m).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count).slice(0,10)};return{n,closed,open,pctClosed:n?closed/n:null,avg,emergency,late,codes,days:daysSet,created,completed,bucket,status,completeness,assessed,suburbs:locations('city'),streets:locations('street'),workCentres:locations('wc'),sources:locations('src')}}
function findings(M,T){const o=[];if(!M.n)return o;o.push({kind:'info',text:`${M.open} of ${M.n} notifications (${pct(M.n?M.open/M.n:0)}) remain open; ${M.closed} are closed.`});M.codes.filter(c=>c.late).forEach(c=>o.push({kind:'danger',text:`${c.late} open “${c.code}” notification(s) exceed the ${c.target}-day target.`}));const compT=T.comp||{};[['wo','works order'],['wc','work centre'],['fl','functional location'],['as','assembly code'],['fc','fault code']].forEach(([k,label])=>{if(compT[k]!=null&&M.completeness[k]<compT[k])o.push({kind:'warn',text:`${label} completeness is ${pct(M.completeness[k])}, below the ${pct(compT[k])} target.`})});const peak=M.days.map((d,i)=>({d,n:M.created[i]})).sort((a,b)=>b.n-a.n)[0];if(peak)o.push({kind:'info',text:`Busiest created date: ${fmtDate(peak.d)} (${peak.n} notifications).`});if(M.emergency)o.push({kind:'warn',text:`${M.emergency} notification(s) carry an emergency (EMER) flag.`});return o}
function chart(id,type,data,extra={}){const el=document.getElementById(id);if(!el||!window.Chart)return;if(state.charts[id])state.charts[id].destroy();const dark=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim();Chart.defaults.color=dark;Chart.defaults.font.family='Inter,system-ui,sans-serif';state.charts[id]=new Chart(el,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='doughnut'||data.datasets.length>1,position:'bottom',labels:{boxWidth:9,usePointStyle:true,font:{size:10}}}},scales:type==='doughnut'?{}:{x:{grid:{display:false},ticks:{font:{size:9},maxRotation:0,autoSkip:true}},y:{beginAtZero:true,grid:{color:'#edf0f5'},ticks:{font:{size:9}}}},...extra}})}function killCharts(){Object.values(state.charts).forEach(c=>c.destroy());state.charts={}}

function renderLocations(M=compute()){const root=$('#app');root.innerHTML=pageHead('Locations &amp; GIS',`${state.rows.length} records · geographic insights and mapped locations`)+`<div class="grid map-layout"><section class="card"><div class="card-title"><div><h2>Notification map</h2><p>Locations are precision-labelled; approximate suburb locations are shown transparently.</p></div><span class="badge info" id="mapCount">Loading map…</span></div><div class="map" id="map"></div><div class="legend"><span><i style="background:#d99b2b"></i>Open</span><span><i style="background:#149574"></i>Closed</span><span>Marker size indicates precision</span></div><p class="muted" id="mapNote" style="font-size:10px;margin:10px 0 0"></p></section><div class="stack"><section class="card"><div class="card-title"><div><h2>Location precision</h2><p>Records plotted by source accuracy</p></div></div><div id="precisionSummary" class="muted" style="font-size:12px">Loading…</div></section><section class="card"><div class="card-title"><div><h2>Top suburbs</h2></div></div>${simpleTable(M.suburbs)}</section><section class="card"><div class="card-title"><div><h2>Top streets</h2></div></div>${simpleTable(M.streets)}</section><section class="card"><div class="card-title"><div><h2>Work centres</h2></div></div>${simpleTable(M.workCentres)}</section><section class="card"><div class="card-title"><div><h2>Notification sources</h2></div></div>${simpleTable(M.sources)}</section></div></div>`;loadMap()}

const precisionColors={coordinates:'#596be8',corrected:'#8f5bd7','geocoded-street':'#19a27d',suburb:'#e3a238'};async function loadMap(){if(state.page!=='locations'||!state.dataset)return;try{const [cfg,data]=await Promise.all([api('/api/config'),api(`/api/datasets/${state.dataset.id}/points`)]);if(state.page!=='locations')return;state.mapPoints=data.points||[];const countBy={coordinates:0,corrected:0,'geocoded-street':0,suburb:0};state.mapPoints.forEach(p=>countBy[p.precision]=(countBy[p.precision]||0)+1);$('#mapCount').textContent=`${state.mapPoints.length} plotted`;$('#precisionSummary').innerHTML=Object.entries(countBy).map(([k,v])=>`<p><span class="badge" style="color:${precisionColors[k]||'#63708a'}">${esc(k)}</span> &nbsp;${v}</p>`).join('')+`<p>${(data.insufficient||[]).length} records with insufficient location data.</p>`;$('#mapNote').textContent=data.crs||'';if(!cfg.mapsKey){$('#map').innerHTML='<div class="empty"><div class="empty-icon">⌖</div><b>Google Maps is not configured</b>Set GOOGLE_MAPS_BROWSER_KEY on the server to enable map tiles.</div>';return}await loadGoogleMaps(cfg.mapsKey);if(state.page!=='locations')return;const map=new google.maps.Map($('#map'),{center:{lat:-33.87,lng:18.52},zoom:11,mapTypeControl:false,streetViewControl:false,fullscreenControl:true});state.map=map;const bounds=new google.maps.LatLngBounds(),info=new google.maps.InfoWindow();state.mapMarkers=[];const admin=state.me?.role==='admin';state.mapPoints.forEach(p=>{const pos={lat:p.lat,lng:p.lng},prec=p.precision||'coordinates',m=new google.maps.Marker({position:pos,map,title:`${p.id} · ${p.code}`,icon:{path:google.maps.SymbolPath.CIRCLE,scale:prec==='suburb'?8:prec==='geocoded-street'?7:6,fillColor:p.closed?'#149574':prec==='suburb'?'#e3a238':'#d99b2b',fillOpacity:prec==='suburb'?.52:.92,strokeColor:precisionColors[prec]||'#fff',strokeWeight:2}});bounds.extend(pos);m.addListener('click',()=>{const div=document.createElement('div');div.style.cssText='font:12px system-ui;min-widt let mapsPromise;function loadGoogleMaps(key){if(window.google?.maps)return Promise.resolve();if(mapsPromise)return mapsPromise;mapsPromise=new Promise((resolve,reject)=>{const callback='__depotMapsReady';window[callback]=()=>resolve();const script=document.createElement('script');script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback='+callback;script.async=true;script.onerror=()=>reject(new Error('Google Maps could not load. Check the browser key and its referrer restrictions.'));document.head.appendChild(script)});return mapsPromise}async function correctLocation(id,lat,lng){const raw=prompt('Enter corrected coordinates as latitude, longitude',`${lat}, ${lng}`);if(!raw)return;const [la,ln]=raw.split(',').map(Number);if(!Number.isFinite(la)||!Number.isFinite(ln)){toast('Enter coordinates as latitude, longitude.','error');return}try{await api(`/api/datasets/${state.dataset.id}/location/${encodeURIComponent(id)}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({lat:la,lng:ln})});toast('Location correction saved.','success');loadMap()}catch(e){toast(e.message,'error')}}

async function runComparison(){const a=$('#compareA').value,b=$('#compareB').value;if(!a||!b||a===b){toast('Choose two different reporting periods.','error');return}const out=$('#compareResult');out.innerHTML='<div class="grid layout2eq"><div class="skeleton"></div><div class="skeleton"></div></div>';try{const [da,db]=await Promise.all([api('/api/datasets/'+a),api('/api/datasets/'+b)]);const A=da.payload,B=db.payload,ma=compute(A.rows,A.T),mb=compute(B.rows,B.T),delta=(x,y)=>{const d=y-x;return`${d>0?'+':''}${Number.isFinite(d)?d.toFixed(1):'—'}${x?` (${d>0?'+':''}${(d/x*100).toFixed(1)}%)`:''}`},matching=new Set(A.rows.map(r=>r.id)),common=B.rows.filter(r=>matching.has(r.id)).length;const kp=[['Total notifications',ma.n,mb.n],['Open',ma.open,mb.open],['Closed',ma.closed,mb.closed],['Closed %',ma.pctClosed*100,mb.pctClosed*100],['Average age (days)',ma.avg,mb.avg],['Open past target',ma.late,mb.late]];const changes=(key)=>{const count=rows=>{const m={};rows.forEach(r=>{const k=String(r[key]||'').trim().toUpperCase();if(k)m[k]=(m[k]||0)+1});return m},x=count(A.rows),y=count(B.rows);return[...new Set([...Object.keys(x),...Object.keys(y)])].map(k=>({name:k,previous:x[k]||0,current:y[k]||0,change:(y[k]||0)-(x[k]||0)})).sort((x,y)=>Math.abs(y.change)-Math.abs(x.change)).slice(0,8)};const suburbs=changes('city'),streets=changes('street'),codes=changes('code');state.comparison={ids:[a,b]};out.innerHTML=`<div class="grid layout2eq" style="margin-top:14px"><div class="card"><div class="card-title"><h3>Previous · ${esc(A.meta.name||'Reporting period')}</h3></div><p>${fmtDate(A.meta.from)} – ${fmtDate(A.meta.to)}</p><b>${ma.n}</b> notifications · ${ma.open} open · ${pct(ma.pctClosed)} closed</div><div class="card"><div class="card-title"><h3>Current · ${esc(B.meta.name||'Reporting period')}</h3></div><p>${fmtDate(B.meta.from)} – ${fmtDate(B.meta.to)}</p><b>${mb.n}</b> notifications · ${mb.open} open · ${pct(mb.pctClosed)} closed</div></div><div class="card" style="margin-top:1 function comparisonTable(title,rows){return`<section class="card"><div class="card-title"><h3>${title}</h3></div>${tableHtml(['Name','Prev.','Current','Δ'],rows.map(x=>[x.name,x.previous,x.current,(x.change>0?'+':'')+x.change]))}</section>`}function tableHtml(headers,rows){return`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?`<b>${esc(v)}</b>`:esc(v)}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="4">No data</td></tr>'}</tbody></table></div>`}
async function generateAI(ids,out,button){button.disabled=true;out.textContent='Preparing your briefing…';try{const d=await api('/api/ai',post({ids}));state.compareAI=d.text||'';out.innerHTML=markdown(state.compareAI)}catch(e){out.textContent=e.message;toast(e.message,'error')}finally{button.disabled=false}}function markdown(text){const safe=esc(text);return safe.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h2>$1</h2>').replace(/^\*\*(.+?)\*\*$/gm,'<b>$1</b>').replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')}
function renderQuality(M=compute()){const root=$('#app'),rows=state.rows,raw=new Set(rows.map(r=>r.city).filter(Boolean)),upper=new Set([...raw].map(x=>x.toUpperCase()));const checks=[['Duplicate notification numbers',(state.data.P?.dups||[]).length,'error'],['Rows skipped (invalid notification number)',(state.data.P?.skipped||[]).length,'warn'],['Rows with no street',rows.filter(r=>!r.street).length,'warn'],['Rows with no suburb/city',rows.filter(r=>!r.city).length,'warn'],['Suburb names differing only by case',raw.size-upper.size,'warn'],['Placeholder suburb (GENERIC TOWN)',rows.filter(r=>/^generic/i.test(r.city||'')).length,'warn'],['Work centre missing or NOT ASSIGNED',rows.filter(r=>r.wc==='(none)'||/NOT ASSIGNED/i.test(r.wc||'')).length,'warn'],['Staff-coded duplicate notification',rows.filter(r=>/^duplicate/i.test(r.code||'')).length,'info'],['Closed without completion date',rows.filter(r=>r.closed&&!r.dd).length,'error'],['Open with completion date',rows.filter(r=>!r.closed&&r.dd).length,'error'],['Rows without created date',rows.filter(r=>!r.dk).length,'error']];root.innerHTML=pageHead('Data quality audit','Transparent data checks aligned with the deterministic engine rules.')+`<div class="card"><div class="card-title"><div><h2>Workbook audit checklist</h2><p>${rows.length} rows inspected · nothing is changed automatically</p></div><span class="badge info">${checks.filter(x=>x[1]>0).length} items to review</span></div><div class="quality-list">${checks.map(([name,count,kind])=>`<div class="quality-item"><span>${esc(name)}</span><span class="badge ${count?(kind==='error'?'danger':kind==='warn'?'warn':'info'):'ok'}">${count}</span></div>`).join('')}</div><div class="divider"></div><p class="muted" style="font-size:11px">Targets sourced from: ${esc(state.data.T?.src||'engine defaults')}. Status meanings such as ORAS and OSNO are not defined by the source workbook.</p></div>`}
function renderData(){const root=$('#app'),admin=state.me?.role==='admin';if(!admin){root.innerHTML=pageHead(titles.data,'Dataset access and reports')+empty('Administrator access required','Uploads and dataset lifecycle controls are available to administrators only.');return}const ds=state.datasets;root.innerHTML=pageHead('Upload &amp; reports','Manage reporting workbooks, versions and original files.')+`<section class="card"><div class="card-title"><div><h2>Upload notification workbook</h2><p>Excel formats accepted: .xlsx, .xlsm and .xls · uploads are preserved as versioned datasets.</p></div></div><div class="upload-zone" id="dropzone"><div class="empty-icon">⇧</div><strong>Drop an Excel workbook here</strong><p>or select a file from your device · maximum 50 MB</p><input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" class="hidden"><button class="btn btn-primary" id="chooseFile">Choose workbook</button><div id="uploadStatus" class="muted" style="font-size:12px;margin-top:12px"></div></div></section><section class="card" style="margin-top:15px"><div class="card-title"><div><h2>Active datasets</h2><p>Each upload is retained as a version; original files remain downloadable.</p></div><span class="badge info">${ds.length} active</span></div>${ds.length?`<div class="table-wrap"><table><thead><tr><th>Period</th><th>Version</th><th>Dataset</th><th>Date range</th><th>Rows</th><th>Actions</th></tr></thead><tbody>${ds.map(d=>`<tr><td><b>${esc(d.period)}</b></td><td>v${esc(d.version)}</td><td>${esc(d.name)}</td><td>${fmtDate(d.date_from)} – ${fmtDate(d.date_to)}</td><td>${d.n}</td><td><div class="inline"><a class="btn" href="/api/datasets/${encodeURIComponent(d.id)}/original">Original file</a><button class="btn btn-danger" data-archive="${esc(d.id)}">Archive</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('No active datasets','Upload a workbook to create your first reporting period.')}</section><section class="card" style="margin-top:15px"><div class="card-title"><div><h2>Archived datasets</h2><p>Archived datasets are retained and can be restored by an administrator.</p></div><button class="btn" id="loadArchive">${$('#showArchived').checked?'Refresh':'Load archived'}</button></div>${$('#showArchived').checked?(state.archived.length?`<div class="table-wrap"><table><thead><tr><th>Period</th><th>Version</th><th>Dataset</th><th>Rows</th><th>Actions</th></tr></thead><tbody>${state.archived.map(d=>`<tr><td>${esc(d.period)}</td><td>v${esc(d.version)}</td><td>${esc(d.name)}</td><td>${d.n}</td><td><div class="inline"><a class="btn" href="/api/datasets/${encodeURIComponent(d.id)}/original">Original file</a><button class="btn" data-restore="${esc(d.id)}">Restore</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('No archived datasets','There are no archived reports.')}:`<div class="muted" style="font-size:12px">Choose Load archived to manage archived reports.</div>`}</section>`;const input=$('#fileInput'),drop=$('#dropzone');$('#chooseFile').onclick=()=>input.click();input.onchange=()=>input.files[0]&&uploadFile(input.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])uploadFile(e.dataTransfer.files[0])};$('#loadArchive').onclick=async()=>{try{state.archived=(await api('/api/datasets?archived=1')).datasets;$('#showArchived').checked=true;renderData()}catch(e){toast(e.message,'error')}};$$('[data-archive]').forEach(b=>b.onclick=()=>lifecycle(b.dataset.archive,'archive'));$$('[data-restore]').forEach(b=>b.onclick=()=>lifecycle(b.dataset.restore,'restore'))}
async function uploadFile(file){if(!/\.(xlsx|xlsm|xls)$/i.test(file.name)){toast('Choose an Excel workbook (.xlsx, .xlsm or .xls).','error');return}const status=$('#uploadStatus');status.textContent=`Uploading ${file.name}…`;const fd=new FormData();fd.append('file',file);try{const result=await api('/api/datasets',{method:'POST',body:fd});toast(result.note||`Dataset uploaded · ${result.period} v${result.version}`,'success');state.datasets=(await api('/api/datasets')).datasets;fillSelector();await loadDataset(result.id);setPage('overview')}catch(e){status.textContent=e.message;toast(e.message,'error')}}async function lifecycle(id,action){const label=action==='archive'?'Archive this dataset?':'Restore this dataset?';if(!confirm(label))return;try{await api(`/api/datasets/${encodeURIComponent(id)}/${action}`,post({}));state.datasets=(await api('/api/datasets')).datasets;if($('#showArchived').checked)state.archived=(await api('/api/datasets?archived=1')).datasets;fillSelector();if(state.dataset&&String(state.dataset.id)===String(id)&&action==='archive'){state.dataset=null;state.data=null;state.rows=[];if(state.datasets.length)await loadDataset(state.datasets[0].id)}toast(action==='archive'?'Dataset archived.':'Dataset restored.','success');renderData()}catch(e){toast(e.message,'error')}}
function renderSettings(){const root=$('#app'),admin=state.me?.role==='admin';root.innerHTML=pageHead('Settings','Account security and access management.')+`<div class="grid layout2eq"><section class="card"><div class="card-title"><div><h2>Change password</h2><p>Choose a password with at least 10 characters.</p></div></div><form id="passwordForm"><div class="field"><label for="currentPassword">Current password</label><input class="input" id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="nextPassword">New password</label><input class="input" id="nextPassword" type="password" minlength="10" autocomplete="new-password" required></div><button class="btn btn-primary">Update password</button></form></section>${admin?`<section class="card"><div class="card-title"><div><h2>User management</h2><p>Create accounts and manage access.</p></div></div><div id="usersTable">Loading users…</div><div class="divider"></div><form id="newUserForm"><div class="field-grid"><div class="field"><label>Email</label><input class="input" id="newEmail" type="email" required></div><div class="field"><label>Temporary password</label><input class="input" id="newUserPassword" type="password" minlength="10" required></div></div><div class="field"><label>Role</label><select class="select" id="newRole"><option value="user">Standard user</option><option value="admin">Administrator</option></select></div><button class="btn btn-primary">Create user</button></form></section>`:`<section class="card"><div class="card-title"><h2>Your access</h2></div><p class="muted">Signed in as <b>${esc(state.me.email)}</b> with standard user access.</p></section>`}</div>`;$('#passwordForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/password',post({current:$('#currentPassword').value,next:$('#nextPassword').value}));e.target.reset();toast('Password updated.','success')}catch(err){toast(err.message,'error')}};if(admin){loadUsers();$('#newUserForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',post({email:$('#newEmail').value,password:$('#newUserPassword').value,role:$('#newRole').value}));e.target.reset();toast('User created.','success');loadUsers()}catch(err){toast(err.message,'error')}}}}
async function loadUsers(){try{const users=(await api('/api/users')).users;$('#usersTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Access</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td><span class="badge ${u.active?'ok':'danger'}">${u.active?'Active':'Inactive'}</span></td><td>${Number(u.id)===Number(state.me.id)?'<span class="muted">Current user</span>':`<button class="btn" data-user="${esc(u.id)}" data-active="${u.active?'false':'true'}">${u.active?'Deactivate':'Activate'}</button>`}</td></tr>`).join('')}</tbody></table></div>`;$$('[data-user]').forEach(b=>b.onclick=async()=>{try{await api('/api/users/'+encodeURIComponent(b.dataset.user),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({active:b.dataset.active==='true'})});toast('User access updated.','success');loadUsers()}catch(e){toast(e.message,'error')}})}catch(e){$('#usersTable').textContent=e.message}}
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-download]');if(b)location.href=`/api/datasets/${encodeURIComponent(b.dataset.download)}/original`});bootstrap();
})();
</script></body></html>
